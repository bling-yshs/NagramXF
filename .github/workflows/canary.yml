name: 🛠️ Canary 构建 (Canary Build)

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      upload:
        description: 'Skip Upload: Set to "y" to skip uploading the build.'
        required: false

permissions:
  contents: read
  actions: read
  models: read

jobs:
  build:
    name: 🔨 构建 Canary APK (Build Canary APK)
    runs-on: ubuntu-24.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "10G"
    steps:
      - name: 检出代码 (Checkout)
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: 安装 Java (Install Java)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: 配置 Ccache (Setup Ccache)
        uses: hendrikmuhs/ccache-action@v1
        with:
          append-timestamp: false
      - name: 配置 Gradle (Setup Gradle)
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true
      - name: 配置 Gradle 缓存 (Setup Gradle Cache)
        uses: actions/cache@v6
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('**/*.gradle') }}
      - name: 安装 Android SDK 工具 (Install Android SDK Tools)
        uses: android-actions/setup-android@v4
        with:
          # ndk must match ndkVersion in the root build.gradle
          packages: "build-tools;36.0.0 ndk;27.2.12479018 platforms;android-36"
      - name: 安装 Python (Install Python)
        uses: actions/setup-python@v7
        with:
          python-version: '3.11.9'
      - name: 安装 Cython (Install Cython)
        run: pip install Cython==3.0.11
      - name: 配置 Android SDK 路径 (Configure Android SDK Path)
        run: |
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties
      - name: 配置 Gradle JVM 参数 (Configure Gradle JVM Arguments)
        run: |
          MEMORY_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          MEMORY_GB=$((MEMORY_KB / 1024 / 1024))
          echo "Detected memory size: ${MEMORY_GB}GB"
          if [ $MEMORY_GB -ge 12 ]; then
            sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
            echo "org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          fi
          cat gradle.properties
      - name: 签名并构建 APK (Sign and Build APK)
        env:
          COMMIT_ID: ${{ github.event.head_commit.id }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          LOCAL_PROPERTIES="$(java .github/scripts/PrepareApkSigning.java)"
          if [ -n "$LOCAL_PROPERTIES" ]; then
            echo "::add-mask::$LOCAL_PROPERTIES"
          fi
          export LOCAL_PROPERTIES
          export BUILD_TIMESTAMP=$(date +%s)
          ./gradlew TMessagesProj:assembleNormalStaging
      - name: 上传 普通版 APK (Upload Normal APK)
        uses: actions/upload-artifact@v7
        with:
          name: normal-canary
          path: TMessagesProj/build/outputs/apk/normal/staging/
          if-no-files-found: error
